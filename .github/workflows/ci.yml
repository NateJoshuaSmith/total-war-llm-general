name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pip install -e .

      - run: ruff check .

      - run: ruff format --check .

      - run: lint-imports

      - run: pytest --cov=tw_general

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v6

      - run: luarocks install luacheck 1.2.0-1

      - run: luarocks install busted 2.3.0-1

      - run: luacheck game/

      - run: busted tests/lua
